[project]
name = "cosmos-agentic-retriever"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4,<5",
  "azure-cosmos>=4.7,<5",
  "azure-identity>=1.17,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=24,<27",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "azure-core>=1.30,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_agentic_retriever"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
markers = ["cosmos_live: read-only integration tests against prepared Cosmos fixtures"]
