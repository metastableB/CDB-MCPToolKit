[project]
name = "cosmos-retriever"
version = "0.1.0"
description = "Cosmos DB retrieval library for the Azure Cosmos DB MCP Toolkit's `agentic_search` tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cosmos Retriever Contributors" }]
keywords = ["retrieval", "rag", "cosmos-db"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "ruff>=0.6,<1",
  "pytest>=8,<9",
]

[project.urls]
Homepage = "https://github.com/your-org/cosmos-retriever"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_retriever"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Retrieval error names are part of the public error model and intentionally
# do not use an "Error" suffix.
"src/cosmos_retriever/retrieval/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/cosmos_retriever"]
